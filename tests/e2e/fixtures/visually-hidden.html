<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visually hidden probe</title>
    <link rel="stylesheet" href="../../../fastblocks_ui/static/css/fastblocks-ui.css" />
  </head>
  <body>
    <button type="button" id="labelled">
      <span aria-hidden="true">×</span>
      <span class="ui-visually-hidden">Close dialog</span>
    </button>

    <p id="visible">Visible paragraph</p>
    <p class="ui-visually-hidden" id="hidden">Hidden paragraph</p>
  </body>
</html>
