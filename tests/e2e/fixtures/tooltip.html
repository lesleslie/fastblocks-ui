<!doctype id="tooltip-fixture">
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tooltip fixture</title>
    <link rel="stylesheet" href="../../../fastblocks_ui/static/css/fastblocks-ui.css" />
  </head>
  <body>
    <button id="trigger-top" aria-describedby="tip-top" popovertarget="tip-top">Save</button>
    <span id="tip-top" role="tooltip" popover="hint" class="ui-tooltip top">Save your changes</span>

    <a href="#" id="trigger-right" aria-describedby="tip-right" popovertarget="tip-right">Edit</a>
    <span id="tip-right" role="tooltip" popover="hint" class="ui-tooltip right">Edit this record</span>

    <!-- Non-focusable trigger (should warn consumers; spec §1.1 trigger requirement) -->
    <div id="non-focusable" aria-describedby="tip-bad">Bad</div>
    <span id="tip-bad" role="tooltip" popover="hint" class="ui-tooltip top">Won't be announced</span>

    <script>
      // Popover hint auto-show on hover/focus: Chrome 151 doesn't ship
      // it natively for either input modality; this script wires
      // mouseenter -> showPopover() and focus -> showPopover() to bridge
      // the gap. See Task 2 report, round 2.
      document.querySelectorAll('[popovertarget]').forEach((inv) => {
        const tipId = inv.getAttribute('popovertarget');
        const tip = document.getElementById(tipId);
        if (!tip) return;
        inv.addEventListener('mouseenter', () => tip.showPopover());
        inv.addEventListener('focus', () => tip.showPopover());
      });
    </script>
  </body>
</html>
